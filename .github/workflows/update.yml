name: Update feeds and publish

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC) — refresh
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["sources.json", "scripts/**", "site/index.html", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser==6.0.11
      - name: Fetch feeds
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          RSSHUB_BASE: ${{ vars.RSSHUB_BASE }}
        run: python scripts/build.py
      - name: Save the story archive back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/feeds
          git diff --cached --quiet || git commit -m "Update feeds $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
